name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install flet
        run: pip install flet

      - name: build apk
        run: flet build apk

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: flet-apk
          path: build/apk/*.apk
